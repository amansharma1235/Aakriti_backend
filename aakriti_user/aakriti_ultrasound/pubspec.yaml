name: aakriti_ultrasound
description: "Aakriti Ultrasound and Diagnostic App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.3
  firebase_storage: ^13.6.0
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  web_socket_channel: ^3.0.3
  intl: ^0.20.3
  font_awesome_flutter: ^11.0.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/image.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/image.png"

  min_sdk_android: 21